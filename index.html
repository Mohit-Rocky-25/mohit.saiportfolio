  <body class="bg-[#EFE8DC] text-[#1C1915] antialiased selection:bg-[#8A4B2A] selection:text-[#EFE8DC]">
    <!-- Subtle fixed SVG paper grain noise overlay (3 to 4% opacity) -->
    <div class="fixed inset-0 pointer-events-none z-[999] opacity-[0.038] mix-blend-multiply" aria-hidden="true">
      <svg class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
        <filter id="noise">
          <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
          <feColorMatrix type="saturate" values="0" />
        </filter>
        <rect width="100%" height="100%" filter="url(#noise)" />
      </svg>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
