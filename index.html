<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23EAE2D1'/><text x='50%' y='65%' dominant-baseline='central' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='56' fill='%23B4441F'>M</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Y. Mohit Sai — Creative Developer & Systems Engineer</title>
    <meta name="description" content="Portfolio of Y. Mohit Sai. Computer Science undergraduate at VIT-AP. Competitive programming, low-latency systems, and deterministic software." />
    
    <!-- Preload portrait photo -->
    <link rel="preload" as="image" href="/images/mohit.webp" type="image/webp" />

    <!-- Google Fonts: Outfit (Bold & Round), Plus Jakarta Sans, Bricolage Grotesque, Geist Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Geist+Mono:wght@400;500;600&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#EAE2D1] text-[#1F1A14] antialiased selection:bg-[#B4441F] selection:text-[#EAE2D1]">
    <!-- Subtle paper grain overlay at 3% opacity -->
    <div class="fixed inset-0 pointer-events-none z-[999] opacity-[0.03] mix-blend-multiply" aria-hidden="true">
      <svg class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
        <filter id="paperGrain">
          <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
          <feColorMatrix type="saturate" values="0" />
        </filter>
        <rect width="100%" height="100%" filter="url(#paperGrain)" />
      </svg>
    </div>

    <!-- Persistent Paw Print Canvas beneath content -->
    <canvas id="paw-canvas" class="fixed inset-0 pointer-events-none z-[5]"></canvas>

    <div id="root" class="relative z-10"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
